name: test-template-generation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate example project
        run: uvx cruft create . --no-input --output-dir /tmp/cc-out

      - name: Sync dependencies
        working-directory: /tmp/cc-out/Example Analysis
        run: uv sync --all-groups

      - name: Initialize git repo for pre-commit
        working-directory: /tmp/cc-out/Example Analysis
        run: |
          git init
          git config user.name "Template Smoke Test"
          git config user.email "template@example.com"
          git add -A
          git commit -m "chore: initialize generated project for hook smoke test"

      - name: Smoke-test pre-commit hooks
        working-directory: /tmp/cc-out/Example Analysis
        run: uv run pre-commit run --all-files
